<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CampusMart is a student marketplace to buy and sell items within your campus.">
    <title>CampusMart | Student Marketplace</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">CampusMart</a>

            <nav class="nav-links" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="#products">Products</a>
                <a href="sell.html" class="btn">Sell an Item</a>
                <button id="theme-toggle" class="btn" type="button" aria-label="Toggle dark mode">🌙</button>
            </nav>
        </div>
    </header>

    <main class="container">

        <section class="hero">
            <h1>Buy and Sell Within Your Campus</h1>
            <p>Find affordable student items or sell things you no longer need.</p>
            <a href="sell.html" class="btn">Start Selling</a>
        </section>

        <section id="products" aria-labelledby="latest-heading">
            <div class="toolbar">
                <h2 id="latest-heading" class="section-title">Latest listings</h2>
                <p class="fav-counter">❤️ Saved: <span id="fav-count">0</span></p>
            </div>

            <div class="filters-bar">
                <div class="form-group">
                    <label for="search">Search listings</label>
                    <input id="search" type="search" placeholder="Try 'book' or 'mouse'" />
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="All">All</option>
                        <option value="Books">Books</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Furniture">Furniture</option>
                        <option value="Stationery">Stationery</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="sort">Sort by</label>
                    <select id="sort">
                        <option value="newest">Newest</option>
                        <option value="price-asc">Price: low → high</option>
                        <option value="price-desc">Price: high → low</option>
                    </select>
                </div>
            </div>

            <p id="result-count" class="muted" aria-live="polite"></p>

            <div class="listing-grid products" id="listing-grid"></div>

            <p id="saved-total" class="saved-total">Total value of saved items: Rs 0</p>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 CampusMart. Made for students.</p>
        </div>
    </footer>

</body>
</html>
